<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Monitor — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 14px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      background: #151720;
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 28px;
      gap: 3px;
    }

    .mode-btn {
      flex: 1;
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .mode-btn.active {
      background: #2d3148;
      color: #e2e8f0;
    }

    /* Form */
    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .field input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.95rem;
      padding: 10px 12px;
      transition: border-color 0.15s;
    }

    .field input:focus {
      outline: none;
      border-color: #6366f1;
    }

    .error-msg {
      display: none;
      color: #fca5a5;
      font-size: 0.82rem;
      background: #3b1212;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
      padding: 9px 12px;
      margin-bottom: 16px;
    }

    .submit-btn {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 11px;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 4px;
    }

    .submit-btn:hover    { opacity: 0.88; }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <span class="dot"></span>
    <h1>Portfolio Monitor</h1>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="loginTab">Sign In</button>
    <button class="mode-btn"       id="registerTab">Create Account</button>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="authForm" autocomplete="on">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             autocomplete="username" placeholder="Enter your username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" placeholder="Enter your password" />
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
  </form>
</div>

<script>
  let mode = 'login';

  const loginTab   = document.getElementById('loginTab');
  const registerTab = document.getElementById('registerTab');
  const submitBtn  = document.getElementById('submitBtn');
  const errorMsg   = document.getElementById('errorMsg');
  const form       = document.getElementById('authForm');

  loginTab.addEventListener('click', () => setMode('login'));
  registerTab.addEventListener('click', () => setMode('register'));

  function setMode(m) {
    mode = m;
    loginTab.classList.toggle('active', m === 'login');
    registerTab.classList.toggle('active', m === 'register');
    submitBtn.textContent = m === 'login' ? 'Sign In' : 'Create Account';
    errorMsg.style.display = 'none';
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showError('Please enter both username and password.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'login' ? 'Signing in…' : 'Creating account…';
    errorMsg.style.display = 'none';

    try {
      const res  = await fetch('/' + mode, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        showError(data.error || 'Something went wrong.');
      } else {
        window.location.href = '/';
      }
    } catch (err) {
      showError('Network error. Is the server running?');
    } finally {
      submitBtn.disabled    = false;
      submitBtn.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
    }
  });

  function showError(msg) {
    errorMsg.textContent   = msg;
    errorMsg.style.display = 'block';
  }
</script>

</body>
</html>
